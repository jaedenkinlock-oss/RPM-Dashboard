version: "3.9"

services:
  dashboard:
    build: .
    image: rpm-reit-dashboard:latest
    ports:
      - "8501:8501"
    environment:
      - FRED_API_KEY=${FRED_API_KEY:-}
    volumes:
      - reit_cache:/app/data/cache
      - reit_logs:/app/logs
    restart: unless-stopped

volumes:
  reit_cache:
  reit_logs:
